openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact Book
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    Simple contact book app with opportunities to create personal contacts.
    It includes registration to customize contacts for different users.
tags:
  - name: Contacts
    description: Endpoints for managing contacts.
servers:
  - url: https://nodejs-hw-mongodb-02nl.onrender.com
  - url: http://127.0.0.1:3000
paths:
  /contacts:
    get:
      summary: Retrieve all contacts
      tags:
        - Contacts
      operationId: getAllContacts
      description: Retrieve a list of all contacts for the authenticated user. Supports optional filtering and pagination.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of contacts per page.
          schema:
            type: integer
            example: 10
        - name: offset
          in: query
          required: false
          description: Number of contacts to skip for pagination.
          schema:
            type: integer
            example: 0
        - name: isFavourite
          in: query
          required: false
          description: Filter contacts by favourite status.
          schema:
            type: boolean
      responses:
        '200':
          description: Successfully retrieved the list of contacts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/unAuthorizedError'
        '500':
          description: Internal server error.
    post:
      summary: Add a new contact
      tags:
        - Contacts
      requestBody:
        description: Contact data to add.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '201':
          description: Contact created successfully.
        '401':
          $ref: '#/components/responses/unAuthorizedError'
      security:
        - BearerAuth: []
  /contacts/{contactId}:
    get:
      summary: Get a contact by ID
      tags:
        - Contacts
      parameters:
        - name: contactId
          in: path
          required: true
          description: ID of the contact to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Contact details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/unAuthorizedError'
        '404':
          description: Contact not found
      security:
        - BearerAuth: []
    patch:
      summary: Update a contact by ID
      tags:
        - Contacts
      parameters:
        - name: contactId
          in: path
          required: true
          description: ID of the contact to update.
          schema:
            type: string
      requestBody:
        description: Fields to update in the contact.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '200':
          description: Contact updated successfully.
        '401':
          $ref: '#/components/responses/unAuthorizedError'
        '404':
          description: Contact not found
      security:
        - BearerAuth: []
    delete:
      summary: Delete a contact by ID
      tags:
        - Contacts
      parameters:
        - name: contactId
          in: path
          required: true
          description: ID of the contact to delete.
          schema:
            type: string
      responses:
        '204':
          description: Contact deleted successfully.
        '401':
          $ref: '#/components/responses/unAuthorizedError'
        '404':
          description: Contact not found
      security:
        - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    unAuthorizedError:
      description: Unauthorized. The user is not authenticated.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized
  schemas:
    Contact:
      type: object
      properties:
        name:
          type: string
          description: Name of the contact.
          example: John Doe
        email:
          type: string
          description: Email address of the contact.
          example: john.doe@example.com
        phone:
          type: string
          description: Phone number of the contact.
          example: '+123456789'
        address:
          type: string
          description: Address of the contact.
          example: '123 Elm Street'
        isFavourite:
          type: boolean
          description: Marks if the contact is a favourite.
          example: true
        createdAt:
          type: string
          format: date-time
          description: Contact creation timestamp.
          example: '2023-12-27T12:34:56Z'
        updatedAt:
          type: string
          format: date-time
          description: Contact update timestamp.
          example: '2023-12-27T13:00:00Z'
      required:
        - name
        - email
        - phone
